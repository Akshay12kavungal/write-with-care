version: '3.8'

services:
  write-with-care:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: write_with_care_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

