<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="record-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#292524" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Sheet Background (Clean unruled / subtle grid record paper) -->
  <rect x="20" y="20" width="560" height="760" rx="6" fill="#FFFDF9" filter="url(#record-shadow)" stroke="#EADBC6" stroke-width="1.5"/>

  <!-- Left Inner Record Border -->
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="#292524" stroke-width="1.5"/>

  <!-- Experiment Header Bar -->
  <line x1="35" y1="85" x2="565" y2="85" stroke="#292524" stroke-width="1"/>
  <text x="50" y="65" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#292524">EXPERIMENT NO: 04</text>
  <text x="230" y="65" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#292524">DATE: 14 / 10 / 2026</text>
  <text x="440" y="65" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#C97F89">PAGE NO: 18</text>

  <!-- Title -->
  <text x="50" y="125" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#C97F89">AIM OF THE EXPERIMENT:</text>
  <text x="50" y="152" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#292524">To determine the focal length of a convex lens by u-v method and parallax.</text>

  <!-- Apparatus Required -->
  <text x="50" y="190" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700" fill="#C97F89">APPARATUS REQUIRED:</text>
  <text x="50" y="218" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#292524">Optical bench with four uprights, convex lens, two optical needles, scale.</text>

  <!-- Principle & Formula Box -->
  <rect x="50" y="240" width="500" height="60" rx="6" fill="#FAF6F0" stroke="#C97F89" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="65" y="265" font-family="'Caveat', cursive, sans-serif" font-size="17" font-weight="700" fill="#292524">Formula:  1 / f  =  1 / v  -  1 / u   =&gt;   f = (u × v) / (u + v)</text>
  <text x="65" y="288" font-family="'Poppins', sans-serif" font-size="10" fill="#78716C">Where u = object distance (cm), v = image distance (cm), f = focal length</text>

  <!-- Tabular Column -->
  <text x="50" y="335" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700" fill="#292524">OBSERVATIONS &amp; TABULAR COLUMN:</text>
  
  <rect x="50" y="350" width="500" height="150" fill="#FFFFFF" stroke="#292524" stroke-width="1.2"/>
  <!-- Table Header -->
  <line x1="50" y1="385" x2="550" y2="385" stroke="#292524" stroke-width="1.2"/>
  <line x1="100" y1="350" x2="100" y2="500" stroke="#292524" stroke-width="1"/>
  <line x1="220" y1="350" x2="220" y2="500" stroke="#292524" stroke-width="1"/>
  <line x1="340" y1="350" x2="340" y2="500" stroke="#292524" stroke-width="1"/>
  <line x1="440" y1="350" x2="440" y2="500" stroke="#292524" stroke-width="1"/>

  <g font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#292524" text-anchor="middle">
    <text x="75" y="372">Sl. No.</text>
    <text x="160" y="372">Object dist. u (cm)</text>
    <text x="280" y="372">Image dist. v (cm)</text>
    <text x="390" y="372">f = uv / (u+v)</text>
    <text x="495" y="372">Mean f (cm)</text>
  </g>

  <!-- Rows -->
  <line x1="50" y1="415" x2="550" y2="415" stroke="#E8B4B8" stroke-width="0.8"/>
  <line x1="50" y1="445" x2="550" y2="445" stroke="#E8B4B8" stroke-width="0.8"/>
  <line x1="50" y1="475" x2="550" y2="475" stroke="#E8B4B8" stroke-width="0.8"/>

  <g font-family="'Caveat', cursive, sans-serif" font-size="16" fill="#292524" text-anchor="middle">
    <text x="75" y="405">1</text>
    <text x="160" y="405">30.0</text>
    <text x="280" y="405">30.2</text>
    <text x="390" y="405">15.05</text>
    
    <text x="75" y="435">2</text>
    <text x="160" y="435">35.0</text>
    <text x="280" y="435">26.3</text>
    <text x="390" y="435">15.02</text>
    <text x="495" y="445" font-weight="700" fill="#8A414B">15.03 cm</text>

    <text x="75" y="465">3</text>
    <text x="160" y="465">40.0</text>
    <text x="280" y="465">24.1</text>
    <text x="390" y="465">15.04</text>
  </g>

  <!-- Result Section -->
  <text x="50" y="540" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700" fill="#C97F89">RESULT:</text>
  <text x="50" y="568" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#292524">1. The focal length of the given convex lens = 15.03 cm.</text>
  <text x="50" y="596" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#292524">2. The graph plotted between u and v is a rectangular hyperbola.</text>

  <!-- Signature line -->
  <line x1="380" y1="710" x2="530" y2="710" stroke="#78716C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="400" y="728" font-family="'Poppins', sans-serif" font-size="11" fill="#78716C">Teacher's Sign / Date</text>

  <!-- Badge Sample -->
  <rect x="50" y="700" width="135" height="28" rx="14" fill="#F8E9EB" stroke="#C97F89" stroke-width="1"/>
  <text x="62" y="718" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#C97F89">SAMPLE PREVIEW</text>
</svg>

