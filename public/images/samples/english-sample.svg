<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="eng-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#292524" flood-opacity="0.1"/>
    </filter>
    <pattern id="eng-lines" width="100" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="100" y2="30" stroke="#E8B4B8" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="560" height="760" rx="8" fill="#FFFDF9" filter="url(#eng-shadow)" stroke="#EADBC6" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="760" fill="url(#eng-lines)"/>

  <!-- Left double line margin -->
  <line x1="95" y1="20" x2="95" y2="780" stroke="#C97F89" stroke-width="1.5" opacity="0.8"/>
  <line x1="100" y1="20" x2="100" y2="780" stroke="#C97F89" stroke-width="0.75" opacity="0.4"/>
  <line x1="20" y1="95" x2="580" y2="95" stroke="#C97F89" stroke-width="1.2" opacity="0.7"/>

  <!-- Header -->
  <text x="120" y="60" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#292524">ENGLISH LITERATURE &amp; ESSAY WRITING</text>
  <text x="120" y="82" font-family="'Poppins', sans-serif" font-size="11" fill="#78716C">ROMANTIC PERIOD • WILLIAM WORDSWORTH</text>
  <text x="490" y="60" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#C97F89">PAGE: 03</text>

  <!-- Title -->
  <text x="120" y="140" font-family="'Caveat', cursive, sans-serif" font-size="25" font-weight="700" fill="#292524">Poetry: "The Solitary Reaper"</text>
  <line x1="120" y1="148" x2="410" y2="148" stroke="#292524" stroke-width="1.2"/>

  <!-- Quotation box -->
  <rect x="120" y="170" width="430" height="75" rx="6" fill="#F8E9EB" stroke="#C97F89" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="135" y="200" font-family="'Caveat', cursive, sans-serif" font-size="20" font-style="italic" fill="#8A414B">"Behold her, single in the field,</text>
  <text x="135" y="228" font-family="'Caveat', cursive, sans-serif" font-size="20" font-style="italic" fill="#8A414B"> Yon solitary Highland Lass!"</text>

  <!-- Cursive commentary text -->
  <g fill="#292524" font-family="'Caveat', cursive, sans-serif" font-size="19">
    <text x="120" y="280" font-weight="700" fill="#8A414B">Critical Analysis &amp; Central Theme:</text>
    <text x="120" y="310">Wordsworth's encounter with the Scottish maiden singing in the fields</text>
    <text x="120" y="340">epitomizes Romantic lyrical transcendence. The poet cannot understand</text>
    <text x="120" y="370">her Gaelic lyrics, yet the melodious tone conveys universal melancholy.</text>

    <text x="120" y="420" font-weight="700" fill="#8A414B">Stylistic Devices Employed:</text>
    <text x="140" y="450">• Melancholic strain mirrored in traditional ballad metre.</text>
    <text x="140" y="480">• Hyperbolic comparisons with Nightingale and Cuckoo bird.</text>
    <text x="140" y="510">• The lasting resonance of melody carried long after it was heard no more.</text>

    <text x="120" y="560" font-weight="700" fill="#8A414B">Conclusion:</text>
    <text x="120" y="590">The poem proves that emotional beauty transcends dialectical boundaries,</text>
    <text x="120" y="620">celebrating organic harmony between humanity and natural quietude.</text>
  </g>

  <!-- Bottom Details -->
  <line x1="20" y1="710" x2="580" y2="710" stroke="#E8B4B8" stroke-width="0.8"/>
  <rect x="420" y="724" width="135" height="28" rx="14" fill="#F8E9EB" stroke="#C97F89" stroke-width="1"/>
  <text x="432" y="742" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#C97F89">SAMPLE PREVIEW</text>
  <text x="120" y="742" font-family="'Poppins', sans-serif" font-size="10" fill="#78716C">Write With Care • Elegant English Penmanship</text>
</svg>

