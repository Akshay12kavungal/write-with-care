<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="sr-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#292524" flood-opacity="0.1"/>
    </filter>
    <pattern id="sr-lines" width="100" height="26" patternUnits="userSpaceOnUse">
      <line x1="0" y1="26" x2="100" y2="26" stroke="#E8B4B8" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="560" height="760" rx="6" fill="#FFFDF9" filter="url(#sr-shadow)" stroke="#EADBC6" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="760" fill="url(#sr-lines)"/>

  <!-- Margins -->
  <line x1="90" y1="20" x2="90" y2="780" stroke="#C97F89" stroke-width="1.5" opacity="0.8"/>
  <line x1="20" y1="95" x2="580" y2="95" stroke="#C97F89" stroke-width="1.2" opacity="0.7"/>

  <!-- Header -->
  <text x="110" y="60" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#292524">SIMPLE RECORD WRITING: CHEMISTRY LAB</text>
  <text x="110" y="82" font-family="'Poppins', sans-serif" font-size="11" fill="#78716C">ACID-BASE TITRATION • VOLUMETRIC ANALYSIS</text>
  <text x="490" y="60" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#C97F89">PAGE: 07</text>

  <!-- Title -->
  <text x="110" y="138" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="700" fill="#292524">Exp No: 02 — Estimation of Sodium Hydroxide</text>
  <line x1="110" y1="146" x2="490" y2="146" stroke="#292524" stroke-width="1.2"/>

  <!-- Content -->
  <g fill="#292524" font-family="'Caveat', cursive, sans-serif" font-size="18">
    <text x="110" y="185" font-weight="700" fill="#8A414B">Short Principle:</text>
    <text x="110" y="211">The estimation is based on the neutralization reaction between</text>
    <text x="110" y="237">standard Oxalic acid solution and the given unknown NaOH solution,</text>
    <text x="110" y="263">using Phenolphthalein as an indicator (colorless to pale pink).</text>

    <text x="110" y="305" font-weight="700" fill="#8A414B">Reagents &amp; Standard Solutions:</text>
    <text x="130" y="331">• Standard Oxalic Acid Solution: 0.1 N</text>
    <text x="130" y="357">• Unknown Sodium Hydroxide (NaOH) Solution</text>
    <text x="130" y="383">• Indicator: Phenolphthalein (1-2 drops)</text>
  </g>

  <!-- Mini observation grid -->
  <rect x="110" y="410" width="440" height="110" fill="#FFFFFF" stroke="#292524" stroke-width="1"/>
  <line x1="110" y1="440" x2="550" y2="440" stroke="#292524" stroke-width="1"/>
  <line x1="180" y1="410" x2="180" y2="520" stroke="#292524" stroke-width="0.8"/>
  <line x1="300" y1="410" x2="300" y2="520" stroke="#292524" stroke-width="0.8"/>
  <line x1="430" y1="410" x2="430" y2="520" stroke="#292524" stroke-width="0.8"/>

  <g font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#292524" text-anchor="middle">
    <text x="145" y="428">Trial</text>
    <text x="240" y="428">Initial Burette (ml)</text>
    <text x="365" y="428">Final Burette (ml)</text>
    <text x="490" y="428">Volume of NaOH</text>
  </g>

  <g font-family="'Caveat', cursive, sans-serif" font-size="16" fill="#292524" text-anchor="middle">
    <text x="145" y="465">1</text>
    <text x="240" y="465">0.00</text>
    <text x="365" y="465">19.80</text>
    <text x="490" y="465">19.80 ml</text>

    <text x="145" y="495">2</text>
    <text x="240" y="495">0.00</text>
    <text x="365" y="495">19.80</text>
    <text x="490" y="495" font-weight="bold" fill="#8A414B">19.80 ml (Concordant)</text>
  </g>

  <!-- Calculations & Result -->
  <g fill="#292524" font-family="'Caveat', cursive, sans-serif" font-size="18">
    <text x="110" y="565" font-weight="700" fill="#8A414B">Normality Calculation:</text>
    <text x="110" y="591">N1 × V1 = N2 × V2   =&gt;   N2 = (0.1 × 20) / 19.80 = 0.1010 N</text>

    <text x="110" y="635" font-weight="700" fill="#C97F89">Result:</text>
    <text x="110" y="661">The strength of given NaOH solution is calculated as 0.1010 N.</text>
  </g>

  <!-- Bottom Details -->
  <line x1="20" y1="710" x2="580" y2="710" stroke="#E8B4B8" stroke-width="0.8"/>
  <rect x="420" y="724" width="135" height="28" rx="14" fill="#F8E9EB" stroke="#C97F89" stroke-width="1"/>
  <text x="432" y="742" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#C97F89">SAMPLE PREVIEW</text>
  <text x="110" y="742" font-family="'Poppins', sans-serif" font-size="10" fill="#78716C">Simple Record Writing • Starting at ₹5 per page</text>
</svg>

