<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="pres-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#292524" flood-opacity="0.1"/>
    </filter>
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#F5EBDD" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="560" height="760" rx="8" fill="#FFFFFF" filter="url(#pres-shadow)" stroke="#EADBC6" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="760" fill="url(#grid-pattern)"/>

  <!-- Spiral rings / Binding punch holes on left -->
  <g fill="#FAF6F0" stroke="#78716C" stroke-width="1.2">
    <circle cx="45" cy="80" r="7"/>
    <circle cx="45" cy="160" r="7"/>
    <circle cx="45" cy="240" r="7"/>
    <circle cx="45" cy="320" r="7"/>
    <circle cx="45" cy="400" r="7"/>
    <circle cx="45" cy="480" r="7"/>
    <circle cx="45" cy="560" r="7"/>
    <circle cx="45" cy="640" r="7"/>
    <circle cx="45" cy="720" r="7"/>
  </g>

  <!-- Left margin line -->
  <line x1="85" y1="20" x2="85" y2="780" stroke="#C97F89" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="110" y="50" width="440" height="55" rx="8" fill="#F8E9EB" stroke="#C97F89" stroke-width="1"/>
  <text x="130" y="85" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#8A414B">NOTEBOOK PRESENTATION MASTERCLASS</text>

  <!-- Content -->
  <g fill="#292524" font-family="'Caveat', cursive, sans-serif" font-size="19">
    <text x="110" y="145" font-weight="700" fill="#292524">1. Dual Color Pen Hierarchy:</text>
    <text x="110" y="175">We use dark ink for headers and balanced blue ink for body text.</text>
    <text x="110" y="205">This contrast draws attention to pivotal theorems, definitions &amp; dates.</text>

    <!-- Highlighted box -->
    <rect x="110" y="230" width="440" height="95" rx="8" fill="#FAF6F0" stroke="#292524" stroke-width="1.2"/>
    <text x="125" y="260" font-weight="700" fill="#8A414B">★ Definition: First Law of Thermodynamics</text>
    <text x="125" y="290">"Energy can neither be created nor destroyed; it can only change form."</text>
    <text x="125" y="315" font-size="16" fill="#78716C">Formula: ΔU = Q - W (Where ΔU = change in internal energy)</text>

    <text x="110" y="365" font-weight="700" fill="#292524">2. Clean Diagram &amp; Schematic Placement:</text>
    <text x="110" y="395">Every diagram is boxed with adequate breathing room and labelled</text>
    <text x="110" y="425">neatly with straight guide rules.</text>
  </g>

  <!-- Neat vector diagram mock inside notebook -->
  <rect x="130" y="445" width="400" height="150" rx="8" fill="#FFFDF9" stroke="#E8B4B8" stroke-width="1.2"/>
  <circle cx="200" cy="520" r="45" fill="none" stroke="#292524" stroke-width="2"/>
  <circle cx="340" cy="520" r="45" fill="none" stroke="#C97F89" stroke-width="2"/>
  <text x="175" y="525" font-family="'Caveat', cursive" font-size="16" fill="#292524">System A</text>
  <text x="315" y="525" font-family="'Caveat', cursive" font-size="16" fill="#C97F89">System B</text>
  <path d="M245 520 L295 520" stroke="#8A414B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="510" font-family="'Poppins', sans-serif" font-size="10" fill="#8A414B">Heat (Q)</text>
  <text x="210" y="580" font-family="'Poppins', sans-serif" font-size="10" fill="#78716C">Fig 1.1: Thermodynamic Exchange Model</text>

  <g fill="#292524" font-family="'Caveat', cursive, sans-serif" font-size="19">
    <text x="110" y="635" font-weight="700" fill="#292524">3. Margin Discipline:</text>
    <text x="110" y="665">Uniform right &amp; left margins prevent ragged edges, giving an</text>
    <text x="110" y="695">authoritative, textbook-level look to your college submissions.</text>
  </g>

  <!-- Bottom Details -->
  <rect x="420" y="724" width="135" height="28" rx="14" fill="#F8E9EB" stroke="#C97F89" stroke-width="1"/>
  <text x="432" y="742" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#C97F89">SAMPLE PREVIEW</text>
</svg>

