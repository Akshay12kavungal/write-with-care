<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <filter id="hero-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#292524" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B4B8"/>
      <stop offset="100%" stop-color="#C97F89"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6F0"/>
    </linearGradient>
  </defs>

  <!-- Background Decorative Circles -->
  <circle cx="560" cy="120" r="140" fill="#F8E9EB" opacity="0.6"/>
  <circle cx="120" cy="380" r="100" fill="#F5EBDD" opacity="0.7"/>

  <!-- Back Open Notebook (Tilted left) -->
  <g transform="translate(60, 40) rotate(-4 250 200)" filter="url(#hero-shadow)">
    <!-- Hardcover -->
    <rect x="30" y="30" width="460" height="340" rx="16" fill="#292524"/>
    <!-- Left Page -->
    <rect x="42" y="42" width="215" height="316" rx="6" fill="#FAF6F0"/>
    <!-- Right Page -->
    <rect x="263" y="42" width="215" height="316" rx="6" fill="#FFFDF9"/>
    <!-- Spine binding -->
    <line x1="257" y1="42" x2="257" y2="358" stroke="#DEC7AA" stroke-width="4"/>
    <!-- Ruled lines on left page -->
    <line x1="60" y1="90" x2="235" y2="90" stroke="#E8B4B8" stroke-width="1.2"/>
    <line x1="60" y1="120" x2="235" y2="120" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="60" y1="150" x2="235" y2="150" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="60" y1="180" x2="235" y2="180" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="60" y1="210" x2="235" y2="210" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="60" y1="240" x2="235" y2="240" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="60" y1="270" x2="235" y2="270" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="60" y1="300" x2="235" y2="300" stroke="#E8B4B8" stroke-width="1"/>

    <!-- Left Margin -->
    <line x1="85" y1="42" x2="85" y2="358" stroke="#C97F89" stroke-width="1.2"/>

    <!-- Ruled lines on right page -->
    <line x1="285" y1="90" x2="455" y2="90" stroke="#E8B4B8" stroke-width="1.2"/>
    <line x1="285" y1="120" x2="455" y2="120" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="285" y1="150" x2="455" y2="150" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="285" y1="180" x2="455" y2="180" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="285" y1="210" x2="455" y2="210" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="285" y1="240" x2="455" y2="240" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="285" y1="270" x2="455" y2="270" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="285" y1="300" x2="455" y2="300" stroke="#E8B4B8" stroke-width="1"/>

    <!-- Right Margin -->
    <line x1="310" y1="42" x2="310" y2="358" stroke="#C97F89" stroke-width="1.2"/>

    <!-- Text mockup -->
    <text x="95" y="115" font-family="'Caveat', cursive" font-size="16" font-weight="700" fill="#292524">Write With Care</text>
    <text x="95" y="145" font-family="'Caveat', cursive" font-size="14" fill="#292524">Neat &amp; organized assignments...</text>
    <text x="95" y="175" font-family="'Caveat', cursive" font-size="14" fill="#292524">Every line written with precision.</text>

    <text x="320" y="115" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#8A414B">College Record Writing</text>
    <text x="320" y="145" font-family="'Caveat', cursive" font-size="14" fill="#292524">Tabular columns &amp; clear formulas</text>
    <text x="320" y="175" font-family="'Caveat', cursive" font-size="14" fill="#292524">Affordable rates: ₹5 - ₹10/page</text>
  </g>

  <!-- Foreground Sheet (tilted right) -->
  <g transform="translate(240, 140) rotate(6)" filter="url(#hero-shadow)">
    <rect x="0" y="0" width="340" height="260" rx="12" fill="url(#paper-grad)" stroke="#EADBC6" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="340" y2="45" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="0" y1="85" x2="340" y2="85" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="0" y1="125" x2="340" y2="125" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="0" y1="165" x2="340" y2="165" stroke="#E8B4B8" stroke-width="1"/>
    <line x1="0" y1="205" x2="340" y2="205" stroke="#E8B4B8" stroke-width="1"/>
    
    <line x1="50" y1="0" x2="50" y2="260" stroke="#C97F89" stroke-width="1.5"/>

    <text x="65" y="35" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#8A414B">Your Handwriting Partner!</text>
    <text x="65" y="75" font-family="'Caveat', cursive" font-size="18" fill="#292524">Beautiful Handwriting. Quality Work.</text>
    <text x="65" y="115" font-family="'Caveat', cursive" font-size="17" fill="#292524">Affordable Prices for College Students.</text>
    <text x="65" y="155" font-family="'Caveat', cursive" font-size="16" fill="#C97F89">Malappuram District, Kerala</text>
    <text x="65" y="195" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#292524">WhatsApp: 88917 46484</text>
    
    <!-- Gold/Rose Wax Seal Accent -->
    <circle cx="285" cy="210" r="28" fill="url(#rose-grad)" stroke="#FAF6F0" stroke-width="2"/>
    <circle cx="285" cy="210" r="23" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="285" y="214" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">WWC</text>
  </g>

  <!-- Luxury Fountain Pen -->
  <g transform="translate(380, 220) rotate(-42)" filter="url(#hero-shadow)">
    <!-- Pen Barrel -->
    <rect x="-8" y="-120" width="16" height="150" rx="5" fill="#292524"/>
    <rect x="-7" y="-115" width="4" height="140" fill="#44403C" opacity="0.6"/>
    <!-- Gold / Rose Gold Ring -->
    <rect x="-9" y="28" width="18" height="8" rx="2" fill="#E8B4B8"/>
    <!-- Grip Section -->
    <path d="M-6 36 L6 36 L5 70 L-5 70 Z" fill="#1C1917"/>
    <!-- Nib Base -->
    <rect x="-5" y="70" width="10" height="6" fill="#C97F89"/>
    <!-- Nib Tip (Rose Gold) -->
    <path d="M-5 76 L5 76 L0 102 Z" fill="url(#rose-grad)"/>
    <!-- Slit and Breather hole -->
    <line x1="0" y1="76" x2="0" y2="98" stroke="#292524" stroke-width="1"/>
    <circle cx="0" cy="86" r="1.5" fill="#292524"/>
  </g>

  <!-- Stationery clips / rulers -->
  <g transform="translate(140, 360)">
    <!-- Rose Gold Paper Clip -->
    <path d="M0 0 V35 C0 42 12 42 12 35 V10 C12 5 22 5 22 10 V38 C22 48 -2 48 -2 38 V0" fill="none" stroke="#C97F89" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(180, 390)">
    <path d="M0 0 V30 C0 36 10 36 10 30 V8 C10 4 18 4 18 8 V32 C18 40 -2 40 -2 32 V0" fill="none" stroke="#E8B4B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Quality Badges -->
  <g transform="translate(80, 260)" filter="url(#hero-shadow)">
    <rect x="0" y="0" width="160" height="48" rx="24" fill="#FFFFFF" stroke="#E8B4B8" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" fill="#F8E9EB"/>
    <text x="24" y="29" font-family="'Playfair Display', serif" font-size="14" fill="#C97F89" text-anchor="middle">₹</text>
    <text x="48" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#292524">From ₹5 - ₹10</text>
    <text x="48" y="36" font-family="'Poppins', sans-serif" font-size="9.5" fill="#78716C">College Friendly</text>
  </g>

  <g transform="translate(480, 70)" filter="url(#hero-shadow)">
    <rect x="0" y="0" width="170" height="48" rx="24" fill="#FFFFFF" stroke="#E8B4B8" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" fill="#F8E9EB"/>
    <path d="M19 24L23 28L30 20" stroke="#C97F89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#292524">Neat &amp; Timely</text>
    <text x="48" y="36" font-family="'Poppins', sans-serif" font-size="9.5" fill="#78716C">100% Student Care</text>
  </g>
</svg>

